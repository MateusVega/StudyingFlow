{% extends "layout.html" %}
{% block content %}
    <section class="w-[80vw] mx-auto">
        <header class="flex flex-wrap gap-4 items-center justify-center my-5">
            {% for category in categories %}
                <a href="{{ url_for('community.blog_category', category=category.name) }}"
                   class="px-3 py-1.5 rounded-3xl md:text-lg text-base font-bold transition duration-300 ease-in-out hover:scale-105">{{ category.name }}</a>
            {% endfor %}
        </header>
        <main class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 my-10">
            {% for blog in blogs %}
                <a href="{{ url_for('community.blog_post', blog_title=blog.title) }}"
                   class="bg-white shadow-md rounded-lg overflow-hidden lg:w-[95%] w-[70%] mx-auto transition duration-300 ease-in-out hover:scale-105">
                    <img class="w-full h-52 object-cover"
                         src="{{ url_for('static', filename='blog_pics/' +blog.image_file) }}"
                         alt="{{ blog.title }}">
                    <div class="p-4">
                        <p class="text-xs text-gray-500">{{ blog.category.name }} • {{ blog.created_at.strftime("%B %d, %Y") }}</p>
                        <p class="text-lg font-medium mt-2">{{ blog.title }}</p>
                    </div>
                </a>
            {% endfor %}
        </main>
    </section>
{% endblock content %}
