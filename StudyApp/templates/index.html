{% extends "layout.html" %}
{% block content %}
    <section class="w-[95vw] h-[88vh] flex flex-col lg:flex-row mx-auto md:items-center">
        <div class="w-4/5 md:w-1/2 h-auto my-10 md:h-full md:my-0 flex flex-col justify-center gap-2 2xl:gap-3 mx-auto">
            <h1 class="font-bold sm:text-7xl 2xl:text-8xl text-4xl">
                Master Your
                <br>
                Study Routine
            </h1>
            <p class="text-base sm:text-lg text-gray-700/70 2xl:text-xl">
                Tools to help you stay organized, study smarter,
                <br class="md:block hidden">
                and achieve better results.
            </p>
            <a class="font-bold text-sm w-fit bg-black text-white px-6 py-3 2xl:text-xl rounded-full hover:bg-white hover:text-black hover:border hover:border-gray-300 hover:scale-[103%] transition duration-300 ease-in-out"
               href="{{ url_for('users.register') }}">Get Started</a>
        </div>
        <img class="w-4/5 md:w-[45%] h-2/3 md:h-[95%] rounded-2xl mx-auto"
             src="{{ url_for('static', filename='ImageHomePage.jpg') }}"
             alt="Preview website functions">
    </section>
{% endblock content %}
