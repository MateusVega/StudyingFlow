<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <link rel="stylesheet"
              href="{{ url_for('static', filename='css/output.css') }}">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
              rel="stylesheet">
        <link rel="stylesheet"
              href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
        <link rel="icon"
              href="{{ url_for('static', filename='favicon-light.ico') }}"
              type="image/png">
        <title>StudyingFlow - Admin</title>
    </head>
    <body class="font-poppins">
        <header id="header" class="bg-white h-[10vh] z-50">
            <nav class="flex justify-between items-center w-[92%] mx-auto my-5">
                <a href="{{ url_for('main.index') }}">
                    <img class="2xl:h-16 h-12 transition duration-300 ease-in-out hover:scale-110"
                         src="{{ url_for('static', filename='Logo.png') }}"
                         alt="StudyingFlow Icon">
                </a>
                <ul class="flex flex-row md:items-center md:gap-[4vw] gap-5">
                    <li class="flex items-center gap-1 text-base transition duration-300 ease-in-out hover:scale-110">
                        <a class="md:text-xl text-sm" href="{{ url_for('admin.admin_panel') }}">Admin</a>
                    </li>
                    <li class="flex items-center gap-1 text-base transition duration-300 ease-in-out hover:scale-110">
                        <a class="md:text-xl text-sm" href="{{ url_for('admin.users') }}">Users</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>
    <main class="h-[88vh]">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, msg in messages %}
                    <div id="flash_element"
                         class="alert-{{ category }} px-4 py-3 rounded relative md:w-[50vw] w-[90vw] mx-auto my-2"
                         role="alert">
                        <strong class="font-bold">{{ msg.title }}</strong>
                        <span class="block sm:inline">{{ msg.message }}</span>
                        <span class="flex items-center absolute top-0 bottom-0 right-0 px-4 py-3 cursor-pointer hover:scale-125 transition"
                              onclick="close_flash()">
                            <svg class="fill-current h-6 w-6 text-{{ category }}-500"
                                 role="button"
                                 xmlns="http://www.w3.org/2000/svg"
                                 viewBox="0 0 20 20">
                                <title>Close</title>
                                <path d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1 0 1.698z" />
                            </svg>
                        </span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    <script>
        function close_flash(){
            const element = document.getElementById("flash_element")
            element.remove()
        }
    </script>
</body>
</html>
